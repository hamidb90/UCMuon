name: Test run

# The comprehensive test run is the claim a reader checks first, and the one
# thing that must never quietly stop reproducing. It runs here on every change
# to the pipeline it exercises, in both of the ways a reader can run it: with
# the Fortran generator built, and without it, which is the path taken by anyone
# who has not built the suite and is the one the fallback exists for.

on:
  push:
    paths:
      - 'test_run/**'
      - 'gui/ucmuon_stochastic_driver.py'
      - 'gui/ucmuon_bb_driver.py'
      - 'gui/mcs_margin.py'
      - 'benchmark/analysis/mcs_thick_target.py'
      - 'src/generator/**'
      - 'tests/flux/test_input_validation.py'
      - 'hpc/input_params.dat'
      - 'src/transport/**'
      - 'src/common/**'
      - 'tests/transport/**'
      - 'tests/rng/**'
      - 'src/converters/**'
      - 'tests/converters/**'
      - 'tools/check_consistency.py'
      - 'Makefile'
      - '.github/workflows/test_run.yml'
  pull_request:
    paths:
      - 'test_run/**'
      - 'gui/ucmuon_stochastic_driver.py'
      - 'gui/ucmuon_bb_driver.py'
      - 'gui/mcs_margin.py'
      - 'benchmark/analysis/mcs_thick_target.py'
      - 'src/generator/**'
      - 'tests/flux/test_input_validation.py'
      - 'hpc/input_params.dat'
      - 'src/transport/**'
      - 'src/common/**'
      - 'tests/transport/**'
      - 'tests/rng/**'
      - 'src/converters/**'
      - 'tests/converters/**'
      - 'tools/check_consistency.py'
      - 'Makefile'
      - '.github/workflows/test_run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-compiler:
    name: ${{ matrix.os }} / no Fortran compiler
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade numpy
      - name: Nothing is built
        run: test ! -e bin/ucmuon_gen_omp
      - name: Run the test
        run: bash test_run/run_test.sh
      - name: Stage 1 is reported as skipped, not as a pass
        run: |
          bash test_run/run_test.sh | tee out.txt
          grep -q "not checked: muons_selected.dat" out.txt
      - name: Consistency checks
        run: python3 tools/check_consistency.py --fast --public .

  with-generator:
    name: ubuntu-latest / generator built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade numpy
      - name: Build the surface generator
        run: |
          gfortran --version
          make ucmuon_gen_omp
          test -x bin/ucmuon_gen_omp
      - name: Run the test
        run: bash test_run/run_test.sh
      - name: Both stages ran and were graded
        run: |
          bash test_run/run_test.sh | tee out.txt
          grep -q "RESULT: PASS" out.txt
          grep -q "wrote test_run/output/muons_selected.dat" out.txt
      - name: The generator rejects invalid input (exit status 2, a message)
        run: python3 tests/flux/test_input_validation.py
      - name: Transport engine fixes after 1.3.2 (Bethe-Bloch water, pencil beams)
        run: |
          make ucmuon_transport_bb_omp
          python3 tests/transport/test_transport_fixes.py
      - name: Multiple scattering, thick-target limit (UCMuon-MC, Bethe-Bloch, margin)
        run: python3 tests/transport/test_mcs_thick_target.py
      - name: UCMuon-MC energy loss (tabulated spectra, mean loss, spin-1/2 knock-ons)
        run: python3 tests/transport/test_energy_loss_model.py
      - name: Command-line converters (cosmic electrons, muons unchanged)
        run: |
          make ucmuon_to_phits
          python3 tests/converters/test_converters.py
      # src/common/ucmuon_rng.f90 replaced the CERNLIB RANLUX, RANMAR and RNORML
      # (GPL) after 1.4.1 and must give the same numbers, bit for bit.
      - name: Random number routines reproduce the CERNLIB streams
        run: |
          python3 -m pip install pytest
          python3 -m pytest tests/rng -q -p no:cacheprovider

  mpi:
    name: ubuntu-latest / MPI generator, 2 ranks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran and Open MPI
        run: sudo apt-get update && sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin
      - name: Build the MPI generator
        run: |
          make ucmuon_gen
          test -x bin/ucmuon_gen
      - name: hpc/input_params.dat on 2 ranks (2000 muons), and an invalid input stops both
        run: |
          mkdir run && cd run
          strip() { sed 's/#.*//' "$1" | sed 's/[[:space:]]*$//' | grep -v '^$'; }
          strip ../hpc/input_params.dat | sed 's/^100000$/2000/' > ok.txt
          UCMUON_SEED=5 OMP_NUM_THREADS=1 mpirun -n 2 --oversubscribe ../bin/ucmuon_gen < ok.txt > ok.log
          for f in ucmuon_selected_00000.dat ucmuon_selected_00001.dat; do
            test "$(grep -vc '^#' "$f")" -eq 1000
          done
          sed '13s/.*/9/' ok.txt > bad.txt          # angular_mode 9
          if mpirun -n 2 --oversubscribe ../bin/ucmuon_gen < bad.txt > bad.log 2>&1; then
            echo "invalid input was accepted"; exit 1
          fi
          grep -q "INPUT ERROR: angular_mode must be 1 to 6" bad.log
