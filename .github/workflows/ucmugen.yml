name: UCMuGen

# UCMuGen is a header-only library whose whole promise is "drop this file in and
# it compiles". That promise is only worth as much as the compilers it has been
# tried on, so the core job is a matrix rather than a single build.
#
# Not covered here, deliberately:
#   - test_geant4 needs a Geant4 installation (a multi-GB build). run_tests.sh
#     skips it rather than failing, and it is run locally before releases.
#   - PARMA's reference build: UCMuGen_PARMA.h is in the tree (JAEA licence,
#     non-commercial) and test_parma runs here, but its comparison against
#     JAEA's stock parma_cpp build needs that release, which is not.

on:
  push:
    paths:
      - 'ucmugen/**'
      - 'src/generator/**'
      - 'gui/fast_flux_estimator.py'
      - 'gui/ucmuon_backward_mc.py'
      - 'gui/ucmuon_terrain_driver.py'
      - 'tests/flux/**'
      - 'tests/geometry/**'
      - 'gui/live_time.py'
      - '.github/workflows/ucmugen.yml'
  pull_request:
    paths:
      - 'ucmugen/**'
      - 'src/generator/**'
      - 'gui/fast_flux_estimator.py'
      - 'gui/ucmuon_backward_mc.py'
      - 'gui/ucmuon_terrain_driver.py'
      - 'tests/flux/**'
      - 'tests/geometry/**'
      - 'gui/live_time.py'
      - '.github/workflows/ucmugen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The portability claim: four compiler/platform combinations, warnings fatal.
  suite:
    name: ${{ matrix.os }} / ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: g++ }
          - { os: ubuntu-latest, cxx: clang++ }
          - { os: macos-latest,  cxx: clang++ }
          - { os: macos-latest,  cxx: g++-14 }
    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: ${{ matrix.cxx }} --version

      # -Werror is applied here rather than inside run_tests.sh so that a local
      # run stays usable on a compiler with a different warning set, while CI
      # still refuses to let a warning land.
      - name: Header compiles clean, standalone
        run: |
          printf '#include "UCMuGen.h"\nint main(){ return 0; }\n' > /tmp/hdr.cc
          ${{ matrix.cxx }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I ucmugen/include /tmp/hdr.cc -o /tmp/hdr

      - name: Validation suite
        env:
          CXX: ${{ matrix.cxx }}
        run: ./ucmugen/validation/run_tests.sh

      # The feature tour is documentation that runs, and the paper quotes its
      # numbers, so it has to keep building and keep finishing. It needs no
      # Geant4 and takes a few seconds. The Geant4 example cannot be built here
      # for the same reason test_geant4 is not run; it is a pre-release step.
      #
      # -Werror is applied here and not in run_tests.sh for the same reason as
      # the header check above: a local run stays usable on a compiler with a
      # different warning set, CI does not.
      - name: Feature tour example
        run: |
          ${{ matrix.cxx }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I ucmugen/include ucmugen/examples/features/feature_tour.cc \
            -o /tmp/feature_tour
          /tmp/feature_tour

      # run_tests.sh already runs this, but it is repeated as a named step so
      # that a documentation number going stale reads as its own failure in the
      # UI rather than as a line buried in the suite's output. This is the check
      # that would have caught the two defects that motivated it.
      - name: Documented numbers still match the code
        run: |
          python3 ucmugen/validation/check_numbers.py --exe /tmp/feature_tour

  # The strongest check in the project: UCMuGen reproduces the Fortran RNG
  # bit-for-bit, so agreement is exact event equality rather than a tolerance.
  # A single differing event fails the build.
  bit-exact:
    name: bit-exact vs Fortran
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gfortran and numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip numpy

      - name: Build the Fortran generator
        run: make ucmuon_gen_omp

      - name: Build the UCMuGen dump tool
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -I ucmugen/include \
            ucmugen/validation/dump_ucmugen.cc -o ucmugen/validation/dump_ucmugen

      - name: Exact event comparison
        working-directory: ucmugen/validation
        run: python3 compare_legacy.py --n 20000

  # The same spectrum is implemented three times (Fortran, UCMuGen, Python).
  # They drifted apart once, by up to x10, and nothing noticed; this job is
  # what notices. The second script checks each spectrum against PDG and
  # published data with the tolerances stated in its header.
  flux:
    name: flux consistency and references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gfortran and numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip numpy

      - name: C++ / Fortran / Python agree
        run: python3 tests/flux/test_flux_consistency.py

      - name: Spectra against PDG and data
        run: python3 tests/flux/test_flux_reference.py

      - name: Backward MC warns at the end of its range table
        run: python3 tests/flux/test_backward_mc_range.py

      - name: Detector-filter ray intersections
        run: bash tests/geometry/run.sh

      - name: Build the Fortran generator
        run: make ucmuon_gen_omp

      - name: Angular mode 6 samples J(p,theta), legacy mode 4 does not
        run: python3 tests/flux/test_joint_sampling.py --quick

      - name: GUI live time agrees with UCMuGen
        run: python3 tests/flux/test_live_time.py --quick
